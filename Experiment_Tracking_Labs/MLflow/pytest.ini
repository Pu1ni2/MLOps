[pytest]
testpaths = tests
filterwarnings =
    # MLflow's hint about integer columns: the wine data has no missing values (see tracking.py)
    ignore:.*Inferred schema contains integer column:UserWarning
    # Deprecation notices that MLflow's own code triggers in pandas 3.1 and SQLAlchemy 2.1, not this lab's code
    ignore::DeprecationWarning:mlflow
